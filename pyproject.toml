[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-quiescence"
version = "3.0.0"
description = "Train on the box you serve from: a VRAM readiness preflight for machines that serve and train on one GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miguel Sanchez", email = "contact@miguelsanchez.co.uk" }]
keywords = ["gpu", "vram", "ollama", "fine-tuning", "training", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
fallback = ["psutil"]
torch = ["torch"]

[project.urls]
Homepage = "https://github.com/m-sanchez/gpu-quiescence"

[project.scripts]
gpu-quiescence = "gpu_quiescence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
