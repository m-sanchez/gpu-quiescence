name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Windows is a supported platform (ctypes GlobalMemoryStatusEx, the
    # BELOW_NORMAL_PRIORITY_CLASS launch path), so CI has to actually run there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest build
      - run: pytest -q
      - name: install proof
        shell: bash
        run: |
          python -m build --wheel
          VENV="$RUNNER_TEMP/install-proof"
          python -m venv "$VENV"
          PY="$VENV/bin/python"
          CLI="$VENV/bin/gpu-quiescence"
          if [ ! -f "$PY" ]; then PY="$VENV/Scripts/python.exe"; CLI="$VENV/Scripts/gpu-quiescence.exe"; fi
          "$PY" -m pip install --quiet dist/*.whl
          "$PY" -c "import gpu_quiescence; assert gpu_quiescence.Handshake; print('import ok')"
          "$CLI" --help > /dev/null && echo "cli ok"
